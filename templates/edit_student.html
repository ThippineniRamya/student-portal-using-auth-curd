{% extends "base.html" %}

{% block title %}Edit Student{% endblock %}

{% block body %}
<div class="center-page">
    <div class="auth-card">
        <h1>Edit Student</h1>
        <p class="sub">Update the details below</p>

        {% if error %}
            <div class="alert alert-error">{{ error }}</div>
        {% endif %}

        <form action="/students/{{ student.id }}/edit" method="post">
            <div class="field">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" value="{{ student.name }}" maxlength="100" required>
            </div>

            <div class="field">
                <label for="student_email">Email</label>
                <input type="email" id="student_email" name="student_email" value="{{ student.email }}" maxlength="100" required>
            </div>

            <div class="field">
                <label for="course">Course</label>
                <input type="text" id="course" name="course" value="{{ student.course }}" maxlength="100" required>
            </div>

            <div class="field">
                <label for="age">Age (optional)</label>
                <input type="number" id="age" name="age" value="{{ student.age if student.age else '' }}" min="1" max="120">
            </div>

            <button type="submit" class="btn">Save Changes</button>
        </form>

        <p class="foot"><a href="/dashboard">Cancel</a></p>
    </div>
</div>
{% endblock %}
